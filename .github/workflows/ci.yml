name: CI Pipeline

# NOTE: To actually BLOCK merges on failure, enable branch protection on GitHub:
# Settings → Branches → Add rule for `main` → "Require status checks to pass
# before merging" and select the "Build and Test" and "Firestore Rules" checks.
# The jobs below fail the run automatically if any step exits non-zero.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Build Production Bundle
        run: npm run build

      - name: Run Unit & Component Tests with Coverage (Vitest)
        run: npm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # The journeys, the patient portal and the accessibility checks sign in:
      # they need the Auth/Firestore emulators (JVM) and the synthetic seed.
      - name: Set up Java (Firebase emulators)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run End-to-End & Accessibility Tests (Playwright + emulators)
        run: npm run test:e2e:emulated

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30

  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"

      # The Firestore emulator runs on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Run Firestore Security Rules Tests (emulator)
        run: npm run test:rules

      # Seeds a synthetic workspace and fails if a screen reads more documents
      # than it shows or if a composite query lacks a versioned index.
      - name: Query Cost Budgets & Index Coverage (emulator)
        run: npm run test:perf:queries

      - name: Verify Emulator Seed Script
        run: npm run seed:emulator
